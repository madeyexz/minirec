  <text x="300" y="345" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#6E6E73">Drag MiniRec to Applications</text>
</svg>
