name: Release

# Pushing a tag "vX.Y.Z" publishes MiniRec X.Y.Z. Installed copies update to it.
# Run it by hand to build, sign, and notarize without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Developer ID signing and notarization
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$P12_BASE64$P12_PASSWORD$ASC_KEY_ID$ASC_ISSUER_ID$ASC_KEY_P8" ]; then
            echo "::warning::No signing secrets: this build is signed ad hoc, so installed copies do not update to it."
            exit 0
          fi
          for name in P12_BASE64 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Signing secret for $name is missing."; exit 1; }
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8"

          {
            echo "SIGN_IDENTITY=Developer ID Application"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "NOTARY_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-app.sh
          codesign -dv build/MiniRec.app 2>&1 | grep -E '^(Authority|TeamIdentifier)=' || true
          if [ -n "${SIGN_IDENTITY:-}" ]; then spctl -a -vv -t exec build/MiniRec.app; fi
      - name: Build DMG
        run: |
          ./scripts/make-dmg.sh
          if [ -n "${SIGN_IDENTITY:-}" ]; then spctl -a -vv -t open --context context:primary-signature build/MiniRec.dmg; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MiniRec
          path: |
            build/MiniRec.zip
            build/MiniRec.dmg
      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" build/MiniRec.dmg build/MiniRec.zip --title "MiniRec ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
